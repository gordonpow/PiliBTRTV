name: bili_tv_app
description: "PiliBTRTV - 嗶哩嗶哩電視版用戶端，加上 BTR 多 CDN 播放加速"
publish_to: 'none'
version: 1.2.2+22

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter

  # Network
  http: ^1.2.0
  dio: ^5.9.0
  
  # Image Caching
  cached_network_image: ^3.3.0
  flutter_cache_manager: ^3.3.1
  
  # File System
  path_provider: ^2.1.0

  # On-device translation (B 站內容英文翻譯)
  google_mlkit_translation: ^1.0.1
  
  # SVG Icons
  flutter_svg: ^2.0.9
  
  # Local Storage
  shared_preferences: ^2.2.2
  
  # Toast
  fluttertoast: ^8.2.14

  # QR Code Generation
  qr_flutter: ^4.1.0
  
  # Crypto for MD5 signing
  crypto: ^3.0.3

  # RSA encryption for phone-assisted login
  encrypt: ^5.0.3
  
  # Video Player - ExoPlayer (via video_player) for H.265 HW Decode
  # 升级到 2.10.0+ 以支持 VideoViewType.platformView (SurfaceView 渲染模式)
  video_player: ^2.10.0
  video_player_android: ^2.9.1
  
  # Danmaku (bullet comments)
  canvas_danmaku: ^0.3.1
  xml: ^6.3.0
  
  # App Update
  package_info_plus: ^8.3.1
  permission_handler: ^11.4.0

  # Performance
  keframe: ^2.0.6

  # UI
  marquee: ^2.2.3

  # Keep Screen On (prevent TV standby during playback)
  wakelock_plus: ^1.2.8
  web_socket_channel: ^3.0.3
  brotli: ^0.6.0
  protobuf: 6.0.0
  fixnum: 1.1.1

# 使用 packages/ 內修改過的 video_player_android（起播緩衝 0.5 秒，見 FastStartLoadControl.java）
dependency_overrides:
  video_player_android:
    path: packages/video_player_android

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/pilibtr_logo_fg.png"
  image_path_android: "assets/icons/pilibtr_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icons/pilibtr_logo_fg.png"
  adaptive_icon_monochrome: "assets/icons/pilibtr_logo_fg.png"

flutter:
  uses-material-design: true
  
  assets:
    - assets/zh/
    - assets/login_guide/
    - assets/icons/startup.mp4
    - assets/icons/startup_frame.jpg
    - assets/icons/home.svg
    - assets/icons/history.svg
    - assets/icons/search.svg
    - assets/icons/dynamic.svg
    - assets/icons/user.svg
    - assets/icons/like.svg
    - assets/icons/coin.svg
    - assets/icons/favorite.svg
    - assets/icons/live.svg
    - assets/icons/settings.svg
